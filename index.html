h2{font-family:var(--f-display);font-weight:600;font-size:1.25rem;margin:0;letter-spacing:.02em}
.count{font-size:.85rem;color:var(--muted)}
.count b{color:var(--ink);font-variant-numeric:tabular-nums}
.topics{display:flex;flex-wrap:wrap;gap:6px}
.topics button{font:600 .9rem var(--f-body);padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--sheet);color:var(--ink);cursor:pointer;display:inline-flex;gap:6px;align-items:baseline}
.topics button small{font-weight:500;color:var(--muted);font-size:.75rem;font-variant-numeric:tabular-nums}
.topics button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.topics button[aria-pressed="true"] small{color:inherit;opacity:.8}
.stats{display:flex;gap:28px;flex-wrap:wrap}
.stat{display:flex;flex-direction:column;gap:2px}
.stat span{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.stat b{font-family:var(--f-mono);font-size:1.2rem;font-variant-numeric:tabular-nums}
#streak{color:var(--c-notes)}#best{color:var(--c-rule)}#score{color:var(--c-task)}

.app{max-width:1280px;margin:0 auto;display:grid;gap:16px;grid-template-columns:minmax(0,1fr);grid-template-areas:"task" "rule" "side";align-items:start}
@media (min-width:760px){.app{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"task task" "rule side"}}
@media (min-width:1250px){.app{grid-template-columns:390px minmax(0,1fr) 360px;grid-template-areas:"rule task side"}}
.panel{--pc:var(--c-task);background:var(--sheet);border:1px solid var(--line);border-top:4px solid var(--pc);border-radius:8px;min-width:0;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.panel.rule{--pc:var(--c-rule)}.panel.notes{--pc:var(--c-notes)}.panel.calcp{--pc:var(--c-calc)}
.panel-head h2{color:var(--pc)}
.panel-head{background:color-mix(in srgb,var(--pc) 9%,transparent)}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.small-btn{font:600 .85rem var(--f-body);padding:6px 10px;border-radius:4px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.small-btn[aria-pressed="true"]{background:var(--soft);border-color:var(--accent);color:var(--accent)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.rule{grid-area:rule}
.rule-body{padding:14px;display:flex;flex-direction:column;gap:10px}
.rule-body h3{margin:0;font-size:1rem;font-weight:600}
.rule-body p{margin:0}

.ex{background:var(--soft);border-radius:4px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;overflow-x:auto}
.ex .line{font-family:var(--f-mono);font-size:.95rem;line-height:1.7}
.ex .line .nb{white-space:nowrap}
.ex .eqrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center}
.ex .opx{font-family:var(--f-mono);color:var(--accent);font-weight:700;white-space:nowrap}
.ex .lab2{display:block;font-family:var(--f-body);font-size:.8rem;color:var(--muted);font-weight:600}
.ex .line .frac{margin:.15em}
.m1{color:var(--m1);font-weight:700}.m2{color:var(--m2);font-weight:700}.m3{color:var(--m3);font-weight:700}
.warn{border-left:3px solid var(--m2);padding:4px 0 4px 10px}
.warn b{display:block;margin-bottom:2px}
.warn ul{padding-left:1.1em}
.sets-list{display:flex;flex-direction:column;gap:8px;font-family:var(--f-mono);font-size:.92rem;line-height:1.5}
.sets-list .sub{font-family:var(--f-body);color:var(--muted);display:block;font-size:.82rem}
.ex .why{font-family:var(--f-body);font-size:.82rem;color:var(--muted);line-height:1.3}
.ex sup{font-size:.68em}
.ladder{display:flex;flex-direction:column;font-family:var(--f-mono);font-size:.9rem;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.kl{display:flex;flex-direction:column;font-family:var(--f-mono);font-size:.95rem;border:1px solid var(--line);border-radius:4px;padding:6px 0}
.kl .r{padding:3px 12px 3px 58px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kl .r.base{background:var(--soft);color:var(--accent);font-weight:600}
.kl .gap{position:relative;height:0}
.kl .gap svg{position:absolute;left:14px;top:-15px;width:22px;height:30px;color:var(--m2)}
.kl .gap span{position:absolute;left:38px;top:-10px;font-family:var(--f-body);font-size:.75rem;font-weight:700;color:var(--m2)}
.ladder .r{display:grid;grid-template-columns:3.6em minmax(0,1fr);gap:8px;padding:5px 10px;align-items:baseline}
.ladder .r b{font-weight:500}
.ladder .r span{overflow-wrap:anywhere}
.ladder .r.base{background:var(--soft);color:var(--accent);font-weight:600}
.ladder .stp{font-family:var(--f-body);font-size:.72rem;color:var(--muted);padding:0 10px 0 calc(3.6em + 18px);line-height:1.2}
.ladder-note{font-size:.82rem;color:var(--muted)}
.rule-off{padding:14px;color:var(--muted);font-size:.9rem}

.task-panel{grid-area:task;overflow:hidden}
.task{padding:22px 18px 26px;min-height:150px;display:flex;flex-direction:column;gap:14px;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:18px 18px;background-position:-1px -1px}
.kind{font-size:.75rem;text-transform:uppercase;letter-spacing:.1em;color:var(--accent);font-weight:600}
.instr{font-size:.95rem;color:var(--muted)}
.q{font-family:var(--f-mono);font-size:1.4rem;line-height:1.7;overflow-wrap:anywhere}
.q sup,.steps sup,.form sup{font-size:.65em}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 .15em;line-height:1.35}
.frac>span{padding:0 .2em}
.frac>span:first-child{border-bottom:2px solid currentColor}
.ov{text-decoration:overline}
.tri{max-width:280px;width:100%;height:auto}
.tri text{font-family:var(--f-mono);font-size:14px;fill:var(--ink)}
.tri .q-mark{fill:var(--accent);font-weight:700}
.answer{padding:16px 18px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.form{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-family:var(--f-mono);font-size:1.2rem}
.form input{font:500 1.1rem var(--f-mono);width:3.6em;padding:7px;border:1.5px solid var(--line);border-radius:4px;background:var(--paper);color:var(--ink);text-align:center}
.form input.wide{width:min(100%,13em);text-align:left}
.form input.expr{width:min(100%,16em);text-align:left}
.form input.exp{width:2.6em;font-size:.9rem;padding:4px;align-self:flex-start}
.form input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.fracform{display:inline-flex;flex-direction:column;gap:6px;align-items:flex-start}
.fracform .bar{height:2px;background:var(--ink);align-self:stretch}
.fracform .row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.fracform .lab{font-family:var(--f-body);font-size:.8rem;color:var(--muted);width:4em}
.keys{display:flex;flex-wrap:wrap;gap:6px}
.keys button{font:500 1.05rem var(--f-mono);min-width:2.8em;padding:6px 8px;border-radius:4px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer}
.choices{display:flex;flex-wrap:wrap;gap:8px}

.choices button b{font-family:var(--f-mono);margin-right:6px}
.note{font-size:.82rem;color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.actions button{font:600 1rem var(--f-body);padding:10px 16px;border-radius:4px;cursor:pointer;border:1.5px solid var(--line);background:transparent;color:var(--ink)}
.actions button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.feedback{padding:10px 12px;border-radius:4px;font-weight:600}
.feedback.ok{background:var(--ok-bg);color:var(--ok)}
.feedback.bad{background:var(--bad-bg);color:var(--bad)}
.feedback.info{background:var(--soft);color:var(--ink);font-weight:500}
.feedback .q{font-size:1.05rem}
.steps{margin-top:10px;padding-top:10px;border-top:1px solid color-mix(in srgb,currentColor 25%,transparent);color:var(--ink);font-weight:400}
.steps>span{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.steps ol{margin:6px 0 0;padding-left:1.3em;display:flex;flex-direction:column;gap:6px}
.steps li{line-height:1.8;overflow-wrap:anywhere}
.steps .op{font-family:var(--f-mono);color:var(--accent);font-weight:600;margin-left:.8em;white-space:nowrap}

.side{grid-area:side;display:flex;flex-direction:column;gap:16px;min-width:0}
.pad-wrap{padding:10px}
.panel.notes{position:relative;z-index:3;width:calc(100% + var(--extraW,0px))}
.wgrip{position:absolute;right:-9px;top:50%;transform:translateY(-50%);width:16px;height:76px;border-radius:8px;background:var(--sheet);border:1px solid var(--line);cursor:ew-resize;touch-action:none;display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.wgrip::before{content:"";width:4px;height:36px;border-radius:2px;background:var(--c-notes);opacity:.8}
.wgrip:hover,.wgrip.drag{background:var(--soft)}
#pad{display:block;width:100%;height:280px;border:1px solid var(--line);border-radius:4px;touch-action:none;cursor:crosshair;
  background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:18px 18px}
#noteText{display:block;width:100%;height:280px;resize:none;font:500 1rem/1.6 var(--f-mono);padding:10px;border:1px solid var(--line);border-radius:4px;background:var(--paper);color:var(--ink)}
.grip{display:flex;justify-content:center;align-items:center;height:22px;margin-top:4px;cursor:ns-resize;touch-action:none;border-radius:4px;color:var(--muted);font:600 .75rem var(--f-body);gap:6px;user-select:none}
.grip:hover,.grip.drag{background:var(--soft);color:var(--accent)}
.grip i{display:block;width:36px;height:4px;border-radius:2px;background:currentColor;opacity:.6}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.calc{padding:10px;display:flex;flex-direction:column;gap:8px}
#calcIn{font:500 1.1rem var(--f-mono);width:100%;padding:8px;border:1.5px solid var(--line);border-radius:4px;background:var(--paper);color:var(--ink)}
#calcIn:focus{outline:none;border-color:var(--accent)}
#calcOut{font-family:var(--f-mono);font-size:1.2rem;min-height:1.6em;text-align:right;overflow-wrap:anywhere}
.cgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}
.cgrid button{font:500 .95rem var(--f-mono);padding:9px 2px;border-radius:4px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer}
.cgrid button.eq{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.cgrid button.fn{background:color-mix(in srgb,var(--c-calc) 12%,var(--paper));color:var(--c-calc)}
.plk{position:absolute;left:0;top:0;width:100%;pointer-events:none;z-index:20;overflow:hidden}
.plk-zone{max-width:1280px;margin:12px auto 0;display:flex;flex-wrap:wrap;gap:6px;pointer-events:none}
.plk-zone img{position:static!important;transform:none!important}
.vol{display:inline-flex;align-items:center;gap:6px;font:600 .8rem var(--f-body);color:var(--muted)}
.vol input{width:90px;accent-color:var(--accent)}
.plk img,.plk-zone img{position:absolute;width:86px;height:auto;border-radius:6px;opacity:.6;box-shadow:0 2px 10px rgba(0,0,0,.35)}
.plk img.new{animation:plkIn .9s cubic-bezier(.2,.9,.3,1.2)}
@keyframes plkIn{0%{transform:scale(3.2) rotate(0deg);opacity:1}60%{opacity:1}100%{transform:scale(1) rotate(var(--rot));opacity:.6}}
.plk-count{font-size:.85rem;color:var(--muted)}
.fun{font:600 .82rem var(--f-body);padding:7px 14px;border-radius:999px;border:1px dashed var(--line);background:transparent;color:var(--muted);cursor:pointer}
#cbBtn{border:2px solid var(--red);color:var(--red)}
.finger{position:fixed;inset:0;display:grid;place-items:center;z-index:30;pointer-events:none;font-size:min(45vw,260px);line-height:1}
.finger span{animation:fing 1.6s ease-out forwards}
@keyframes fing{0%{transform:scale(.2);opacity:0}20%{transform:scale(1.1);opacity:1}70%{transform:scale(1);opacity:1}100%{transform:scale(1);opacity:0}}
@media (prefers-reduced-motion:reduce){.plk img.new,.finger span{animation:none}}
footer{max-width:1280px;margin:16px auto 0;font-size:.82rem;color:var(--muted);background:var(--sheet);border-radius:8px;padding:10px 14px;box-shadow:0 4px 14px rgba(0,0,0,.2)}
@media (prefers-reduced-motion:no-preference){.feedback{animation:pop .18s ease-out}@keyframes pop{from{transform:translateY(-3px);opacity:.6}to{transform:none;opacity:1}}}

<div class="top">
  <header>
    <h1>Mathe-Trainer</h1>
    <div style="display:flex;gap:22px;row-gap:10px;align-items:center;flex-wrap:wrap"><button type="button" class="fun" id="cbBtn">Farbenblind-Modus</button><label class="vol" for="volume">Lautstärke <input type="range" id="volume" min="0" max="100" step="5" value="80"></label><button type="button" class="fun" id="resetBtn">Zurücksetzen</button><span class="plk-count" id="plkCount"></span><div class="count" id="countdown"></div></div>

    <div class="stat"><span>Richtig</span><b id="score">0 / 0</b></div>
  </div>
</div>

<main class="app">
  <section class="panel rule" aria-label="Regel">
    <div class="panel-head"><h2>Regel</h2><button type="button" class="small-btn" id="ruleToggle" aria-expanded="false">Regel zeigen</button></div>
    <div class="rule-body" id="ruleBody" hidden></div>
    <div class="rule-off" id="ruleOff">Die Regel ist ausgeblendet. Versuch es zuerst ohne, wie an der Prüfung. Wenn du nicht weiterkommst: Regel zeigen.</div>
  </section>

  <section class="panel task-panel" aria-label="Aufgabe">
    <div class="task">
      <div class="kind" id="kind"></div>
      <div class="instr" id="instr"></div>
      <div class="q" id="question"></div>
    </div>
    <form class="answer" id="answerForm" autocomplete="off">
      <div class="form" id="inputs"></div>
      <div class="keys" id="keys" hidden></div>
      <div class="note" id="inputNote"></div>
      <div class="actions">
        <button type="submit" class="primary" id="checkBtn">Prüfen</button>
        <button type="button" id="skipBtn">Neue Aufgabe</button>

    </form>
  </section>

  <div class="side">
    <section class="panel notes" aria-label="Notizen">
      <div class="wgrip" id="wgrip" role="separator" aria-orientation="vertical" aria-label="Notizfeld nach rechts breiter ziehen" tabindex="0"></div>
      <div class="panel-head">
        <h2>Notizen</h2>
        <div class="seg">
          <button type="button" class="small-btn" id="modeDraw" aria-pressed="true">Zeichnen</button>
          <button type="button" class="small-btn" id="modeType" aria-pressed="false">Tippen</button>
          <button type="button" class="small-btn" id="undoBtn">Zurück</button>
          <button type="button" class="small-btn" id="clearBtn">Leeren</button>
        </div>
      </div>
      <div class="pad-wrap">
        <canvas id="pad" aria-label="Notizblock zum Zeichnen"></canvas>
        <textarea id="noteText" hidden aria-label="Notizen tippen" placeholder="Zwischenschritte notieren ..."></textarea>
        <div class="grip" id="grip" role="separator" aria-orientation="horizontal" aria-label="Notizfeld grösser oder kleiner ziehen" tabindex="0"><i></i>ziehen ↕ höher<i></i></div>
      </div>
    </section>
    <section class="panel calcp" aria-label="Taschenrechner">
      <div class="panel-head"><h2>Rechner</h2></div>
      <div class="calc">
        <input id="calcIn" aria-label="Rechnung" inputmode="decimal">
        <div id="calcOut" aria-live="polite"></div>
        <div class="cgrid" id="cgrid"></div>
      </div>
    </section>
  </div>
</main>
<div class="plk" id="plk" aria-hidden="true"></div>
<div class="finger" id="finger" hidden aria-hidden="true"></div>

const SUPS={"²":"^2","³":"^3","⁴":"^4","⁵":"^5","⁶":"^6"};
function parse(src){
  let s=String(src).replace(/−/g,"-").replace(/[·×]/g,"*").replace(/:/g,"/").replace(/,/g,".").replace(/[²³⁴⁵⁶]/g,c=>SUPS[c]).replace(/\s+/g,"");
  if(!s)return null;const toks=[];let i=0;
  while(i<s.length){const ch=s[i];
    if(/[\d.]/.test(ch)){let j=i;while(j<s.length&&/[\d.]/.test(s[j]))j++;const v=parseFloat(s.slice(i,j));if(isNaN(v))return null;toks.push({t:"n",v});i=j}
    else if(/[a-z]/i.test(ch)){toks.push({t:"v",v:ch.toLowerCase()});i++}
    else if("+-*/^()[]".includes(ch)){toks.push({t:ch==="["?"(":ch==="]"?")":ch});i++}
    else return null}
  const T=[];toks.forEach((a,k)=>{const p=toks[k-1];if(p&&(p.t==="n"||p.t==="v"||p.t===")")&&(a.t==="n"||a.t==="v"||a.t==="("))T.push({t:"*"});T.push(a)});
  let pos=0;const peek=()=>T[pos],eat=t=>{if(T[pos]&&T[pos].t===t){pos++;return true}return false};
  function expr(){let a=termP();if(!a)return null;while(peek()&&(peek().t==="+"||peek().t==="-")){const op=T[pos++].t,b=termP();if(!b)return null;a={k:op,a,b}}return a}
  function termP(){let a=unary();if(!a)return null;while(peek()&&(peek().t==="*"||peek().t==="/")){const op=T[pos++].t,b=unary();if(!b)return null;a={k:op,a,b}}return a}
  function unary(){if(eat("-")){const a=unary();return a?{k:"neg",a}:null}if(eat("+"))return unary();return power()}
  function power(){const a=atom();if(!a)return null;if(eat("^")){const b=unary();if(!b)return null;return{k:"^",a,b}}return a}
  function atom(){const t=peek();if(!t)return null;if(t.t==="n"){pos++;return{k:"n",v:t.v}}if(t.t==="v"){pos++;return{k:"v",v:t.v}}if(eat("(")){const f=expr();if(!f||!eat(")"))return null;return f}return null}
  const node=expr();if(!node||pos!==T.length)return null;
  return{node,vars:[...new Set(toks.filter(t=>t.t==="v").map(t=>t.v))]};
}
function ev(n,e){switch(n.k){case"n":return n.v;case"v":return e[n.v];case"+":return ev(n.a,e)+ev(n.b,e);case"-":return ev(n.a,e)-ev(n.b,e);
  case"*":return ev(n.a,e)*ev(n.b,e);case"/":return ev(n.a,e)/ev(n.b,e);case"neg":return -ev(n.a,e);case"^":return Math.pow(ev(n.a,e),ev(n.b,e))}return NaN}
const READ_ERR="Die Eingabe kann ich nicht lesen. Schreib z.B. 3x+2, x² oder (x+1)(x−2).";
function sameValue(f,target,vars){let n=0;
  for(let k=0;k<60&&n<6;k++){const e={};vars.forEach((v,j)=>e[v]=Math.round((Math.random()*8-4)*100)/100+0.0173*(j+1));
    const t=target(e);if(!isFinite(t)||Math.abs(t)>1e6)continue;const u=f(e);
    if(!isFinite(u)||Math.abs(u-t)>1e-6*Math.max(1,Math.abs(t)))return false;n++}
  return n>=3}
function checkFrac(nS,dS,target,vars){
  if(/[\/:]/.test(nS+dS))return{msg:"Im Zähler und im Nenner darf kein Bruchstrich mehr stehen. Bring alles auf einen Bruchstrich."};
  const N=parse(nS),D=String(dS).trim()===""?{node:{k:"n",v:1},vars:[]}:parse(dS);
  if(!N||!D)return{msg:READ_ERR};
  const bad=[...N.vars,...D.vars].filter(v=>!vars.includes(v));if(bad.length)return{msg:"In der Aufgabe kommt "+bad[0]+" nicht vor."};
  return{ok:sameValue(e=>ev(N.node,e)/ev(D.node,e),target,vars)};
}
/* Polynom eines Faktors bestimmen (eine Variable, ganze Zahlen) */
function polyOf(node,v){const N=7,A=[],y=[];
  for(let i=0;i<N;i++){const x=i-3;A.push(Array.from({length:N},(_,j)=>Math.pow(x,j)));y.push(ev(node,{[v]:x}))}
  if(y.some(t=>!isFinite(t)))return null;
  for(let c=0;c<N;c++){let p=c;for(let r=c+1;r<N;r++)if(Math.abs(A[r][c])>Math.abs(A[p][c]))p=r;[A[c],A[p]]=[A[p],A[c]];[y[c],y[p]]=[y[p],y[c]];
    for(let r=0;r<N;r++){if(r===c)continue;const f=A[r][c]/A[c][c];for(let k=c;k<N;k++)A[r][k]-=f*A[c][k];y[r]-=f*y[c]}}
  const co=y.map((t,i)=>t/A[i][i]);const r=co.map(x=>Math.round(x));
  if(co.some((x,i)=>Math.abs(x-r[i])>1e-6))return null;
  const test=4.5;let s=0;r.forEach((c,j)=>s+=c*Math.pow(test,j));if(Math.abs(s-ev(node,{[v]:test}))>1e-6*Math.max(1,Math.abs(s)))return null;
  while(r.length>1&&r[r.length-1]===0)r.pop();return r}
function factorList(n){
  if(n.k==="*")return[...factorList(n.a),...factorList(n.b)];
  if(n.k==="neg")return[{k:"n",v:-1},...factorList(n.a)];
  if(n.k==="^"&&n.b.k==="n"&&Number.isInteger(n.b.v)&&n.b.v>=1&&n.b.v<=6){const f=factorList(n.a);let r=[];for(let i=0;i<n.b.v;i++)r=r.concat(f);return r}
  return[n]}
const isSq=n=>n>=0&&Math.round(Math.sqrt(n))**2===n;
function fullyFactored(node,v){
  for(const f of factorList(node)){const p=polyOf(f,v);if(!p)return false;const d=p.length-1;if(d===0)continue;
    if(p.slice(0,d).every(c=>c===0))continue;          // Monom wie 3x²
    if(p.reduce((g,c)=>gcd(g,c),0)!==1)return false;    // gemeinsamer Faktor bleibt in der Klammer
    if(p[0]===0)return false;                           // x steckt noch in der Klammer
    if(d===2&&isSq(p[1]*p[1]-4*p[2]*p[0]))return false; // lässt sich weiter zerlegen
    if(d>2)return false}
  return true}

function genUnits(){

    const U=FAM[fk].u,[from,ff]=pick(U),[to,ft]=pick(U);if(from===to)continue;
    const factor=ff/ft;if(Math.abs(Math.log10(factor))>12.01)continue;
    if(fk==="time"&&Math.random()<.35)return genHms();
    let v=mantissa();if(fk==="time"&&from==="h")v=rnd(11,999)/100;
    const ans=parseFloat((v*factor).toPrecision(12));if(Math.abs(ans)<1e-9||Math.abs(ans)>1e13)continue;
    const steps=[];
    if(fk==="time"){
      if(factor>=1){steps.push("1 "+from+" = "+fmt(factor)+" "+to+", also \u00d7 "+fmt(factor)+".");steps.push(fmt(v)+" \u00d7 "+fmt(factor)+" = <b>"+fmt(ans)+" "+to+"</b>")}
      else{const inv=parseFloat((1/factor).toPrecision(12));steps.push("1 "+to+" = "+fmt(inv)+" "+from+", also \u00f7 "+fmt(inv)+".");steps.push(fmt(v)+" \u00f7 "+fmt(inv)+" = <b>"+fmt(ans)+" "+to+"</b>")}}
    else{const k=Math.round(Math.abs(Math.log10(factor))),big=factor>1,one="1"+"0".repeat(k);
      steps.push(from+" \u2192 "+to+": das Ergebnis wird "+(big?"grösser":"kleiner")+", "+k+" Kommastellen Unterschied"+(fk==="area"?" (Potenz 2 schon eingerechnet)":fk==="vol"?" (Potenz 3 schon eingerechnet)":"")+".");
      steps.push(fmt(v)+(big?" \u00d7 ":" \u00f7 ")+group(one)+" = <b>"+fmt(ans)+" "+to+"</b>")}
    return{instr:"Rechne um.",q:fmt(v)+" "+from+" = ? "+to,form:inp("wide","Ergebnis","Ergebnis","decimal")+"<span>"+to+"</span>",
      note:"Kommazahl mit Punkt oder Komma. Sehr grosse oder kleine Zahlen gehen auch als 2.5e-6 oder 2.5·10^-6.",
      ans:[String(ans)],check:i=>{const u=parseNum(i[0]);return isFinite(u)&&close(u,ans)},solution:fmt(ans)+" "+to,steps,rule:R.units(fk)};
  }
}

function genHms(){const v=rnd(10001,59999)/10000;let msT=Math.round(v*3600000);const H=Math.floor(msT/3600000);msT-=H*3600000;const Mi=Math.floor(msT/60000);msT-=Mi*60000;const S=Math.floor(msT/1000);const MS=msT-S*1000;

  const sol=H+" h "+Mi+" min "+S+" s "+MS+" ms";
  return{instr:"Schreib in h, min, s und ms.",q:fmt(v)+" h = ? h ? min ? s ? ms",form:inp("","Stunden")+"<span>h</span>"+inp("","Minuten")+"<span>min</span>"+inp("","Sekunden")+"<span>s</span>"+inp("","Millisekunden")+"<span>ms</span>",
    note:"Nur ganze Zahlen eintragen.",ans:[H,Mi,S,MS].map(String),check:i=>pInt(i[0],0)===H&&pInt(i[1],0)===Mi&&pInt(i[2],0)===S&&pInt(i[3],0)===MS,solution:sol,
    steps:[H+" h, Rest "+fmt(v-H)+" h \u00b7 60 = "+fmt(r1)+" min",Mi+" min, Rest "+fmt(r1-Mi)+" min \u00b7 60 = "+fmt(r2)+" s",S+" s, Rest "+fmt(r2-S)+" s \u00b7 1000 = "+fmt(r3)+" ms","<b>"+sol+"</b>"],rule:R.units("time")}}

/* ---------- 2 Zahlenmengen ---------- */
const SETS=[["N","ℕ","natürlich"],["Z","ℤ","ganz"],["Q","ℚ","rational"],["I","ℚ′","irrational"]];
function genSets(){
  const sq=[4,9,16,25,36,49,64,81,100,121,144];const nonsq=[2,3,5,6,7,8,10,11,12,13,15,17,18,20,50];
  const items=[
    ()=>{const k=rnd(2,40);return[String(k),"N",k+" ist eine positive ganze Zahl."]},
    ()=>{const s=pick(sq);return["√"+s,"N","√"+s+" = "+Math.sqrt(s)+", eine positive ganze Zahl."]},
    ()=>{const d=rnd(2,6),k=rnd(2,9);return[fracH(k*d,d),"N",fracH(k*d,d)+" = "+k+", der Bruch geht auf."]},
    ()=>["0","Z","Die Null gehört bei uns zu ℤ, nicht zu ℕ."],
    ()=>{const k=rnd(1,40);return[M+k,"Z","Negativ und ganz, also ℤ."]},
    ()=>{const s=pick(sq);return[M+"√"+s,"Z",M+"√"+s+" = "+M+Math.sqrt(s)+", negativ und ganz."]},
    ()=>{const d=rnd(2,5),k=rnd(2,9);return[M+fracH(k*d,d),"Z",M+fracH(k*d,d)+" = "+M+k+", negativ und ganz."]},
    ()=>{let a,b;do{a=rnd(1,11);b=rnd(2,12)}while(gcd(a,b)!==1);const neg=Math.random()<.4;return[(neg?M:"")+fracH(a,b),"Q","Ein Bruch, der nicht aufgeht, ist rational."]},
    ()=>{const v=pick(["7.5","0.25","2.125","0.04","13.6"]);const neg=Math.random()<.4;return[(neg?M:"")+v,"Q","Eine Dezimalzahl, die endet, lässt sich als Bruch schreiben."]},
    ()=>{const d=pick(["3","6","45","142857"]);return["0.<span class=\"ov\">"+d+"</span>","Q","Eine periodische Dezimalzahl ist rational, z.B. 0.<span class=\"ov\">3</span> = "+fracH(1,3)+"."]},
    ()=>{const s=pick(nonsq);return["√"+s,"I",s+" ist keine Quadratzahl, die Wurzel geht nicht auf."]},
    ()=>{const s=pick(nonsq);return[M+"√"+s,"I","Die Wurzel geht nicht auf. Das Minus ändert nichts: irrational."]},
    ()=>{const k=rnd(2,5);return[pick([k+"π",M+"π",fracH("π",k)]),"I","π ist irrational, mal eine rationale Zahl (nicht 0) bleibt irrational."]},
    ()=>{const k=rnd(2,6),s=pick([2,3,5,7]);return[k+"√"+s,"I","√"+s+" ist irrational, mal "+k+" bleibt irrational."]},
    ()=>["0.1010010001…","I","Unendlich viele Stellen ohne Periode: irrational."],
    ()=>{const k=pick([4,9,25]),d=pick([16,49,81]);return["√"+fracH(k,d),"Q","√"+fracH(k,d)+" = "+fracH(Math.sqrt(k),Math.sqrt(d))+", ein Bruch."]}
  ];
  const [h,ans,why]=pick(items)();const name=SETS.find(s=>s[0]===ans);
  return{instr:"Zu welcher kleinsten Zahlenmenge gehört die Zahl?",q:h,choices:SETS.map(s=>({v:s[0],label:"<b>"+s[1]+"</b>"+s[2]})),
    ans:[ans],check:i=>i[0]===ans,solution:h+" ∈ "+name[1],steps:[why,"Also: <b>"+h+" ∈ "+name[1]+"</b>"],rule:R.sets};
}

/* ---------- 3 Gleichartige Glieder ---------- */
function genLike(){
  const kinds=pick([["x","y","z"],["a","b",""],["x<sup>2</sup>","x",""]]);const n=rnd(6,8);const terms=[];
  kinds.forEach(k=>terms.push({k,c:nz(-9,9)}));while(terms.length<n)terms.push({k:pick(kinds),c:nz(-9,9)});
  terms.sort(()=>Math.random()-.5);
  let q="",first=true;
  terms.forEach(t=>{const prod=Math.random()<.18&&Math.abs(t.c)>=4&&Math.abs(t.c)%2===0;
    if(prod)q+=(first?(t.c<0?M:""):(t.c<0?" "+M+" ":" + "))+"2·"+Math.abs(t.c)/2+t.k;else q+=term(t.c,t.k,first);first=false});
  const sum={};kinds.forEach(k=>sum[k]=0);terms.forEach(t=>sum[t.k]+=t.c);
  const lbl=k=>k===""?"Zahlen":k;
  const steps=kinds.map(k=>lbl(k)+": "+terms.filter(t=>t.k===k).map((t,j)=>j===0?cs(t.c):(t.c<0?" "+M+" ":" + ")+Math.abs(t.c)).join("")+" = "+cs(sum[k]));
  const res=joinTerms(kinds.map(k=>[sum[k],k]));steps.push("Ergebnis: <b>"+res+"</b>");
  const vv=kinds.includes("x<sup>2</sup>")?["x"]:kinds.filter(k=>k);
  const val=(k,e)=>k===""?1:k==="x<sup>2</sup>"?e.x*e.x:e[k];
  const target=e=>kinds.reduce((s,k)=>s+sum[k]*val(k,e),0);
  const nTerms=kinds.filter(k=>sum[k]!==0).length;
  const addTerms=n=>(n.k==="+"||n.k==="-")?addTerms(n.a)+addTerms(n.b):1;
  const plainRes=kinds.filter(k=>sum[k]).map(k=>"("+sum[k]+")"+(k===""?"":"*"+(k==="x<sup>2</sup>"?"x^2":k))).join("+")||"0";
  return{instr:"Fasse zusammen.",q,form:"<span>=</span>"+inp("expr","Ergebnis","z.B. 11x\u22125+4y"),keys:true,note:"Schreib das ganze Ergebnis mit Vorzeichen und Variablen.",
    ans:[plainRes],check:i=>{const P=parse(i[0]);if(!P)return{msg:READ_ERR};const bad=P.vars.filter(x=>!vv.includes(x));if(bad.length)return{msg:"In der Aufgabe kommt "+bad[0]+" nicht vor."};
      if(!sameValue(e=>ev(P.node,e),target,vv.length?vv:["x"]))return{ok:false};
      if(addTerms(P.node)>Math.max(nTerms,1))return{ok:false,why:"Stimmt im Wert, aber es lässt sich noch weiter zusammenfassen."};return{ok:true}},solution:res,steps,rule:R.like};
}

/* ---------- 4 Potenzgesetze ---------- */
const VARS=["a","b","x","y","z","r","s"];
const mono=(c,e)=>({c,e});
function mul(p,q){const e={...p.e};for(const k in q.e)e[k]=(e[k]||0)+q.e[k];return mono(p.c*q.c,e)}
function pw(p,k){const e={};for(const v in p.e)e[v]=p.e[v]*k;return mono(Math.pow(p.c,k),e)}
function show(p){const ks=Object.keys(p.e).filter(k=>p.e[k]!==0).sort();if(!ks.length)return cs(p.c);let s=co(p.c);for(const k of ks)s+=sup(k,p.e[k]);return s}
const par=s=>"("+s+")";
function randMono(vars,csx,a,b){const e={};for(const v of vars)e[v]=rnd(a,b);return mono(pick(csx),e)}
function pickVars(n){const pool=[...VARS],v=[];while(v.length<n){const x=pick(pool);pool.splice(pool.indexOf(x),1);v.push(x)}return v.sort()}
function monoCheck(res,vs){return i=>pInt(i[0],1)===res.c&&vs.every((v,j)=>pInt(i[j+1])===res.e[v])}
function fracMonoCheck(cn,cd,net,vs){return i=>{const k=vs.length+1;const tc=pInt(i[0],1),bc=pInt(i[k],1);
  if(!(bc>0)||isNaN(tc)||gcd(tc,bc)!==1||tc*cd!==cn*bc)return false;
  return vs.every((v,j)=>{const te=pInt(i[j+1],0),be=pInt(i[k+j+1],0);return te>=0&&be>=0&&Math.min(te,be)===0&&te-be===net[v]})}}
function fracMonoShow(cn,cd,net,vs){const top=mono(cn,{}),bot=mono(cd,{});vs.forEach(v=>{if(net[v]>0)top.e[v]=net[v];else if(net[v]<0)bot.e[v]=-net[v]});
  return cd===1&&!Object.keys(bot.e).length?show(top):fracH(show(top),show(bot))}
function genPow(){
  const vars=pickVars(rnd(1,2));const type=rnd(1,8);const steps=[];let q,rule;const note="Zahl vorne eintragen (1 darfst du leer lassen, bei −1 nur −), dann die Exponenten.";
  const mulSteps=(p,r)=>{steps.push("Zahlen multiplizieren: "+np(p.c)+DOT+np(r.c)+" = "+cs(p.c*r.c));
    steps.push("Gleiche Basis, Exponenten addieren: "+vars.map(v=>v+"<sup>"+p.e[v]+"+"+r.e[v]+"</sup> = "+sup(v,p.e[v]+r.e[v])).join(", "))};
  let res;
  if(type===1){const p=randMono(vars,[-3,-2,2,3,-1],1,4),k=rnd(2,3);q=par(show(p))+"<sup>"+k+"</sup>";res=pw(p,k);rule=R.powPow;
    steps.push("Jeder Faktor in der Klammer wird hoch "+k+" genommen.");
    steps.push("Zahl: "+np(p.c)+"<sup>"+k+"</sup> = "+cs(res.c)+(p.c<0?(k%2?" (ungerader Exponent, Minus bleibt)":" (gerader Exponent, Minus fällt weg)"):""));
    steps.push("Exponenten mal "+k+": "+vars.map(v=>"("+sup(v,p.e[v])+")<sup>"+k+"</sup> = "+sup(v,p.e[v]*k)).join(", "))}
  else if(type===2){const p=randMono(vars,[-4,-3,-2,2,3,4,5],1,5),r=randMono(vars,[-3,-2,2,3,6],1,5);q=par(show(p))+DOT+par(show(r));res=mul(p,r);mulSteps(p,r);rule=R.powProd}
  else if(type===3){const den=randMono(vars,[2,3,4,-2],1,3),r=pick([2,3,4,-3,5]),num=mono(den.c*r,{});for(const v of vars)num.e[v]=den.e[v]+rnd(1,4);
    q=fracH(show(num),show(den));res=mono(r,{});vars.forEach(v=>res.e[v]=num.e[v]-den.e[v]);rule=R.powQuot;
    steps.push("Zahlen kürzen: "+cs(num.c)+" : "+np(den.c)+" = "+cs(r));
    steps.push("Exponenten subtrahieren (oben minus unten): "+vars.map(v=>v+"<sup>"+num.e[v]+M+den.e[v]+"</sup> = "+sup(v,res.e[v])).join(", "))}
  else if(type===4){const p=randMono(vars,[-2,2,3],1,3),k=rnd(2,3),r=randMono(vars,[-2,2,3,4],1,4);q=par(show(p))+"<sup>"+k+"</sup>"+DOT+show(r);const pk=pw(p,k);res=mul(pk,r);rule=R.powMix;
    steps.push("Zuerst die Klammer: "+par(show(p))+"<sup>"+k+"</sup> = "+show(pk));steps.push("Dann multiplizieren: "+show(pk)+DOT+show(r));mulSteps(pk,r)}
  else if(type===5){const v=vars[0],m=rnd(2,7),k=rnd(2,7);q=sup(v,m)+DOT+"("+M+v+")<sup>"+k+"</sup>";res=mono(k%2?-1:1,{[v]:m+k});rule=R.powNeg;
    steps.push("("+M+v+")<sup>"+k+"</sup>: "+k+" ist "+(k%2?"ungerade, das Minus bleibt: "+M+sup(v,k):"gerade, das Minus fällt weg: "+sup(v,k)));
    steps.push("Exponenten addieren: "+v+"<sup>"+m+"+"+k+"</sup> = "+sup(v,m+k))}
  if(type<=5){const vs=Object.keys(res.e).sort();steps.push("Ergebnis: <b>"+show(res)+"</b>");
    return{instr:"Vereinfache mit den Potenzgesetzen.",q,form:monoFields(vs),note,ans:[String(res.c),...vs.map(v=>String(res.e[v]))],check:monoCheck(res,vs),solution:show(res),steps,rule}}
  if(type===6){let a,b;do{a=rnd(1,5);b=rnd(2,6)}while(gcd(a,b)!==1);const neg=Math.random()<.35,k=rnd(2,3),sa=neg?-a:a,cn=Math.pow(sa,k),cd=Math.pow(b,k);
    q="("+(neg?M:"")+fracH(a,b)+")<sup>"+k+"</sup>";
    steps.push("Zähler und Nenner einzeln hoch "+k+": "+np(sa)+"<sup>"+k+"</sup> = "+cs(cn)+", "+b+"<sup>"+k+"</sup> = "+cd);
    if(neg)steps.push(k%2?"Ungerader Exponent, das Minus bleibt.":"Gerader Exponent, das Minus fällt weg.");
    steps.push("Ergebnis: <b>"+(cn<0?M:"")+fracH(Math.abs(cn),cd)+"</b>");
    return{instr:"Berechne.",q,form:'<div class="fracform"><div class="row"><span class="lab">Zähler</span>'+inp("","Zähler")+'</div><div class="bar"></div><div class="row"><span class="lab">Nenner</span>'+inp("","Nenner")+'</div></div>',
      note:"Minus beim Zähler eintragen.",ans:[String(cn),String(cd)],check:i=>{const u=pInt(i[0]),d=pInt(i[1]);return !isNaN(u)&&d>0&&u*cd===cn*d},
      solution:(cn<0?M:"")+fracH(Math.abs(cn),cd),steps,rule:R.powFracNum}}
  const vs=vars.length===1?pickVars(2):vars;let cn,cd,net={};
  if(type===7){const top=mono(pick([2,3,4,6,8,9,10,12,15]),{}),bot=mono(pick([2,3,4,6,8,9,12]),{});
    vs.forEach((v,j)=>{let a=rnd(1,6),b=rnd(1,6);if(j===0)while(a>=b){a=rnd(1,5);b=rnd(2,7)}if(j===1)while(a<=b){a=rnd(2,7);b=rnd(1,5)}top.e[v]=a;bot.e[v]=b;net[v]=a-b});
    const g=gcd(top.c,bot.c);cn=top.c/g;cd=bot.c/g;q=fracH(show(top),show(bot));
    steps.push("Zahlen kürzen: "+fracH(top.c,bot.c)+" = "+fracH(cn,cd)+(g>1?" (durch "+g+")":""));
    vs.forEach(v=>steps.push(v+": oben "+top.e[v]+", unten "+bot.e[v]+" → "+(net[v]>0?sup(v,net[v])+" bleibt oben":net[v]<0?sup(v,-net[v])+" bleibt unten":"kürzt sich weg")))}
  else{const k=rnd(2,3),a=pick([1,2,3]),b=pick([2,3,5].filter(x=>gcd(x,a)===1)),m=rnd(1,3),n=rnd(1,3),x=vs[0],y=vs[1];
    q="("+fracH((a===1?"":a)+sup(x,m),b+sup(y,n))+")<sup>"+k+"</sup>";cn=Math.pow(a,k);cd=Math.pow(b,k);net[x]=m*k;net[y]=-n*k;
    steps.push("Zähler und Nenner einzeln hoch "+k+".");steps.push("Zahlen: "+a+"<sup>"+k+"</sup> = "+cn+", "+b+"<sup>"+k+"</sup> = "+cd);
    steps.push("Exponenten mal "+k+": "+sup(x,m+"·"+k)+" = "+sup(x,m*k)+", "+sup(y,n+"·"+k)+" = "+sup(y,n*k))}
  const sol=fracMonoShow(cn,cd,net,vs);steps.push("Ergebnis: <b>"+sol+"</b>");
  return{instr:"Vereinfache so weit wie möglich.",q,form:monoFracFields(vs),
    note:"Jede Variable nur oben oder unten, der andere Exponent bleibt leer oder 0. Zahlen gekürzt eintragen, 1 darfst du leer lassen.",
    ans:[String(cn),...vs.map(v=>String(Math.max(net[v],0))),String(cd),...vs.map(v=>String(Math.max(-net[v],0)))],check:fracMonoCheck(cn,cd,net,vs),solution:sol,steps,rule:R.powFracVar};
}

/* ---------- 5 Ausmultiplizieren ---------- */
function genExpand(){
  const v=pick(["x","x","a","b"]),t=rnd(1,5),V2=sup(v,2),B=(c,a)=>"("+(c===1?"":c)+v+signed(a)+")";let q,p,D=2,steps=[],rule;
  if(t===1){const a=nz(-9,9),b=nz(-9,9);q=B(1,a)+B(1,b);p=pmul([a,1],[b,1]);rule=R.distrib;
    steps.push("Jedes Glied mal jedes: "+v+DOT+v+" + "+v+DOT+np(b)+" + "+np(a)+DOT+v+" + "+np(a)+DOT+np(b));steps.push("= "+joinTerms([[1,V2],[b,v],[a,v],[a*b,""]]))}
  else if(t===2){const c=rnd(1,4),a=nz(-7,7);q=B(c,a)+"<sup>2</sup>";p=pmul([a,c],[a,c]);rule=R.binom12;
    steps.push((a>0?"1.":"2.")+" binomische Formel mit a = "+(c===1?"":c)+v+" und b = "+Math.abs(a)+".");
    steps.push("a<sup>2</sup> = "+(c*c===1?"":c*c)+V2+", 2ab = 2"+DOT+(c===1?"":c+DOT)+Math.abs(a)+v+" = "+2*c*Math.abs(a)+v+", b<sup>2</sup> = "+a*a)}
  else if(t===3){const c=rnd(1,4),a=rnd(1,9);q=B(c,a)+B(c,-a);p=[-a*a,0,c*c];rule=R.binom3;
    steps.push("3. binomische Formel: (a + b)(a − b) = a<sup>2</sup> − b<sup>2</sup> mit a = "+(c===1?"":c)+v+", b = "+a+".")}
  else if(t===4){const a=nz(-9,9),b=nz(-9,9),c=nz(-6,6);q=B(1,a)+B(1,b)+" "+M+" "+B(1,c)+"<sup>2</sup>";const p1=pmul([a,1],[b,1]),p2=pmul([c,1],[c,1]);p=padd(p1,p2,-1);rule=R.distrib;
    steps.push("Erste Klammern: "+B(1,a)+B(1,b)+" = "+polyHtml(p1,v));steps.push("Binomische Formel: "+B(1,c)+"<sup>2</sup> = "+polyHtml(p2,v));
    steps.push("Minus vor der Klammer dreht alle Vorzeichen: "+polyHtml(p1,v)+" "+M+" "+V2+(2*c<0?" + ":" "+M+" ")+Math.abs(2*c)+v+" "+M+" "+c*c)}
  else{const a=rnd(1,6),b=nz(-6,6);q=B(1,-a)+B(1,a)+B(1,b);p=pmul([-a*a,0,1],[b,1]);D=3;rule=R.binom3;
    steps.push("Zuerst "+B(1,-a)+B(1,a)+" = "+V2+" "+M+" "+a*a+" (3. binomische Formel)");
    steps.push("Dann ("+V2+" "+M+" "+a*a+")"+B(1,b)+" = "+joinTerms([[1,sup(v,3)],[b,V2],[-a*a,v],[-a*a*b,""]]))}
  while(p.length<=D)p.push(0);steps.push("Zusammengefasst: <b>"+polyHtml(p,v)+"</b>");
  const nT=p.filter(c=>c!==0).length,addT=n=>(n.k==="+"||n.k==="-")?addT(n.a)+addT(n.b):1;
  const plainP=p.map((c,d)=>c?"("+c+")"+(d?"*"+v+"^"+d:""):"").filter(Boolean).join("+")||"0";
  const target=e=>p.reduce((s,c,j)=>s+c*Math.pow(e[v],j),0);
  return{instr:"Multipliziere aus und fasse zusammen.",q,form:"<span>=</span>"+inp("expr","Ergebnis"),keys:true,note:"Schreib das ganze Ergebnis mit Vorzeichen, Hochzahlen mit den Knöpfen.",ans:[plainP],
    check:i=>{const P=parse(i[0]);if(!P)return{msg:READ_ERR};const bad=P.vars.filter(x=>x!==v);if(bad.length)return{msg:"In der Aufgabe kommt "+bad[0]+" nicht vor."};
      if(!sameValue(e=>ev(P.node,e),target,[v]))return{ok:false};const n=addT(P.node);
      const sumIn=x=>!x?false:(x.k==="+"||x.k==="-")?true:x.k==="neg"?sumIn(x.a):false;const prodOfSum=x=>!x||x.k==="n"||x.k==="v"?false:((x.k==="*"||x.k==="/")&&(sumIn(x.a)||sumIn(x.b)))||(x.k==="^"&&sumIn(x.a))||prodOfSum(x.a)||prodOfSum(x.b);
      if(n<nT||prodOfSum(P.node))return{ok:false,why:"Stimmt im Wert, aber es ist noch nicht ganz ausmultipliziert."};
      if(n>nT)return{ok:false,why:"Stimmt im Wert, aber fass noch gleichartige Glieder zusammen."};return{ok:true}},solution:polyHtml(p,v),steps,rule};
}

/* ---------- 6 Ausklammern und Faktorisieren (Methode selbst finden) ---------- */
function genFact(){
  const t=rnd(1,5),v=pick(["x","x","a","r"]);let poly,sol,plainSol,steps,minus=false;
  if(t===5){minus=true;
    if(Math.random()<.6){let a,b;do{a=rnd(1,9);b=nz(-12,12)}while(gcd(a,b)!==1);poly=[b,-a];
      sol=M+"("+polyHtml([-b,a],v)+")";plainSol="-("+a+"*"+v+"+("+(-b)+"))";
      steps=["Das erste Glied ist negativ: −1 ausklammern.","In der Klammer drehen alle Vorzeichen: "+polyHtml(poly,v)+" wird zu "+polyHtml([-b,a],v)+"."]}
    else{let k,m;do{k=rnd(1,6);m=nz(-9,9)}while(gcd(k,m)!==1);poly=[0,m,-k];
      sol=M+v+"("+polyHtml([-m,k],v)+")";plainSol="-"+v+"*("+k+"*"+v+"+("+(-m)+"))";
      steps=["Das erste Glied ist negativ und beide Glieder haben ein "+v+": −"+v+" ausklammern.","In der Klammer drehen alle Vorzeichen: "+polyHtml([-m,k],v)+"."]}}
  else if(t===1){let p,qq;do{p=rnd(-9,9);qq=pick([rnd(-9,9),rnd(-9,9),-p])}while(p===0||qq===0||p===qq);
    if(p===-qq)return genFact();
    poly=[p*qq,p+qq,1];sol=lin(v,p)+lin(v,qq);plainSol="("+v+"+("+p+"))("+v+"+("+qq+"))";
    steps=["Kein gemeinsamer Faktor, keine zwei Quadrate. Also die Form "+sup(v,2)+" + b"+v+" + c.","Gesucht: zwei Zahlen mit Produkt "+cs(p*qq)+" und Summe "+cs(p+qq)+".","Das sind "+cs(p)+" und "+cs(qq)+": "+np(p)+DOT+np(qq)+" = "+cs(p*qq)+", "+np(p)+" + "+np(qq)+" = "+cs(p+qq)]}
  else if(t===2){let k,m,n,p,q;do{k=rnd(2,9);m=rnd(1,3);n=rnd(1,2);p=rnd(1,6);q=nz(-9,9)}while(gcd(p,q)!==1||(n===2&&q<0&&isSq(-4*p*q))||(n===1&&false));
    poly=Array(m+n+1).fill(0);poly[m+n]=k*p;poly[m]=k*q;sol=k+sup(v,m)+"("+(p===1?"":p)+sup(v,n)+signed(q)+")";plainSol=k+"*"+v+"^"+m+"*("+p+"*"+v+"^"+n+"+("+q+"))";
    steps=["Beide Glieder haben einen gemeinsamen Faktor: ausklammern.","Grösster gemeinsamer Teiler von "+k*p+" und "+Math.abs(k*q)+": "+k+". Kleinste Potenz von "+v+": "+sup(v,m)+".",
      "In der Klammer bleibt "+(p===1?"":p)+sup(v,n)+" und "+cs(q)+" (jedes Glied durch "+k+sup(v,m)+" geteilt)."]}
  else if(t===3){let a,b;do{a=rnd(1,6);b=rnd(1,9)}while(gcd(a,b)!==1);
    poly=[-b*b,0,a*a];const A=(a===1?"":a)+v;sol="("+A+" + "+b+")("+A+" "+M+" "+b+")";plainSol="("+a+"*"+v+"+"+b+")("+a+"*"+v+"-"+b+")";
    steps=["Zwei Quadrate mit Minus dazwischen, kein mittleres Glied: 3. binomische Formel.",(a*a===1?"":a*a)+sup(v,2)+" = ("+A+")<sup>2</sup> und "+b*b+" = "+b+"<sup>2</sup>"]}
  else{let a,b;do{a=rnd(1,5);b=nz(-7,7)}while(gcd(a,Math.abs(b))!==1);
    poly=[b*b,2*a*b,a*a];sol="("+(a===1?"":a)+v+signed(b)+")<sup>2</sup>";plainSol="("+a+"*"+v+"+("+b+"))^2";
    steps=["Erstes und letztes Glied sind Quadrate: "+(a*a===1?"":a*a)+sup(v,2)+" = ("+(a===1?"":a)+v+")<sup>2</sup>, "+b*b+" = "+Math.abs(b)+"<sup>2</sup>.","Mittleres Glied prüfen: 2"+DOT+(a===1?"":a)+v+DOT+Math.abs(b)+" = "+Math.abs(2*a*b)+v+". Passt, also "+(b<0?"2.":"1.")+" binomische Formel."]}
  steps.push("Ergebnis: <b>"+sol+"</b>");
  const target=e=>poly.reduce((s,c,j)=>s+c*Math.pow(e[v],j),0);
  return{instr:"Faktorisiere so weit wie möglich. Welche Methode passt?",q:polyHtml(poly,v),form:"<span>=</span>"+inp("expr","Ergebnis","z.B. 3x²(x−4)"),keys:true,
    note:"Schreib das ganze Ergebnis mit Klammern. Hochzahlen mit den Knöpfen ² ³, z.B. (x+2)(x−5) oder 4x²(3x+1).",ans:[plainSol],
    check:i=>{const P=parse(i[0]);if(!P)return{msg:READ_ERR};const bad=P.vars.filter(x=>x!==v);if(bad.length)return{msg:"In der Aufgabe kommt "+bad[0]+" nicht vor."};
      if(!sameValue(e=>ev(P.node,e),target,[v]))return{ok:false};
      if(minus){let c=1,okL=true;for(const f of factorList(P.node)){const q=polyOf(f,v);if(!q){okL=false;break}if(q.length===1)c*=q[0];else if(q[q.length-1]<0)okL=false}
        if(!(c<0)||!okL)return{ok:false,why:"Stimmt im Wert, aber das Minus gehört vor die Klammer und das erste Glied in der Klammer soll positiv sein."}}
      if(!fullyFactored(P.node,v))return{ok:false,why:"Das gibt ausmultipliziert schon das Richtige, ist aber noch nicht ganz faktorisiert. Schau, ob sich noch etwas ausklammern oder zerlegen lässt."};
      return{ok:true}},solution:sol,steps,rule:R.factAll};
}

/* ---------- 7 Brüche addieren ---------- */
function genFracAdd(){
  const t=rnd(1,4);let q,vars,target,sol,steps,A;
  if(t===1){const x=pick(["x","a"]),y=x==="x"?"y":"b",a=rnd(1,9),b=rnd(1,9),s=pick([1,-1]);vars=[x,y];
    q=fracH(a,x)+(s>0?" + ":" "+M+" ")+fracH(b,y);target=e=>a/e[x]+s*b/e[y];
    const num=(a===1?"":a)+y+(s>0?" + ":" "+M+" ")+(b===1?"":b)+x;sol=fracH(num,x+y);A=[a+"*"+y+(s>0?"+":"-")+b+"*"+x,x+"*"+y];
    steps=["Hauptnenner: "+x+DOT+y+" = "+x+y,"Erweitern: "+fracH(a+DOT+y,x+y)+(s>0?" + ":" "+M+" ")+fracH(b+DOT+x,x+y),"Ergebnis: <b>"+sol+"</b>"]}
  else if(t===2){const x="x";let a,b;do{a=pick([2,3,4,5,6,9,18]);b=pick([2,3,4,6,8,12])}while(a===b);const c=rnd(0,3),s=pick([1,-1]);vars=[x];const Lc=lcm(a,b);
    q=fracH(x,a)+(s>0?" + ":" "+M+" ")+fracH(x,b)+(c?" "+M+" "+(c===1?"":c)+x:"");
    const k=Lc/a+s*Lc/b-c*Lc;const g=gcd(k,Lc)||1;target=e=>e[x]/a+s*e[x]/b-c*e[x];
    sol=k===0?"0":Lc/g===1?term(k/g,x,true):fracH(term(k/g,x,true),Lc/g);A=[(k/g)+"*x",String(Lc/g)];
    steps=["Hauptnenner (kgV von "+a+" und "+b+"): "+Lc,"Erweitern: "+fracH((Lc/a===1?"":Lc/a)+x,Lc)+(s>0?" + ":" "+M+" ")+fracH((Lc/b===1?"":Lc/b)+x,Lc)+(c?" "+M+" "+fracH(c*Lc+x,Lc):""),
      "Zähler zusammenfassen: "+fracH(term(k,x,true),Lc)+(g>1?", gekürzt durch "+g:""),"Ergebnis: <b>"+sol+"</b>"]}
  else if(t===3){const x="x";let p,r;do{p=nz(-6,6);r=nz(-6,6)}while(p===r);const a=rnd(1,6),b=rnd(1,6);vars=[x];
    q=fracH(a,x+signed(p))+" "+M+" "+fracH(b,x+signed(r));target=e=>a/(e[x]+p)-b/(e[x]+r);
    const N=[a*r-b*p,a-b],D=lin(x,p)+lin(x,r);sol=fracH(polyHtml(N,x),D);A=["("+(a-b)+")*x+("+(a*r-b*p)+")","(x+("+p+"))*(x+("+r+"))"];
    steps=["Hauptnenner: "+D,"Erweitern: "+fracH(a+lin(x,r),D)+" "+M+" "+fracH(b+lin(x,p),D),"Zähler: "+a+lin(x,r)+" "+M+" "+b+lin(x,p)+" = "+polyHtml([a*r,a],x)+" "+M+" ("+polyHtml([b*p,b],x)+") = "+polyHtml(N,x),"Ergebnis: <b>"+sol+"</b>"]}
  else{const x="x",a=rnd(1,9),m=pick([2,3,4,5]),b=nz(-9,9);vars=[x];
    q=fracH(a,sup(x,2))+(b<0?" "+M+" ":" + ")+fracH(Math.abs(b),m+x);target=e=>a/(e[x]*e[x])+b/(m*e[x]);
    const D=m+sup(x,2);sol=fracH(joinTerms([[b,x],[a*m,""]]),D);A=["("+b+")*x+"+a*m,m+"*x^2"];
    steps=["Hauptnenner: "+D,"Erweitern: "+fracH(a+DOT+m,D)+(b<0?" "+M+" ":" + ")+fracH(Math.abs(b)+x,D),"Ergebnis: <b>"+sol+"</b>"]}
  return{instr:"Bring auf einen Bruchstrich und vereinfache.",q,form:exprFracFields(),keys:true,note:NOTE_EXPR,ans:A,
    check:i=>checkFrac(i[0],i[1],target,vars),solution:sol,steps,rule:R.fracAdd};
}

/* ---------- 8 Doppelbrüche ---------- */
function genDbl(){
  const t=rnd(1,4),x="x";let q,vars=[x],target,sol,steps,A;
  if(t===1){let a,b,c,d;do{a=rnd(1,9);b=rnd(2,9);c=rnd(1,9);d=rnd(2,9)}while(gcd(a,b)!==1||gcd(c,d)!==1||a*d===b*c);vars=[];
    const n=a*d,de=b*c,g=gcd(n,de);q=fracH(fracH(a,b),fracH(c,d));target=()=>n/de;sol=de/g===1?String(n/g):fracH(n/g,de/g);A=[String(n/g),String(de/g)];
    steps=["Geteilt durch "+fracH(c,d)+" heisst mal "+fracH(d,c)+".",fracH(a,b)+DOT+fracH(d,c)+" = "+fracH(n,de),"Kürzen: <b>"+sol+"</b>"]}
  else if(t===2){let p,qq,r,s;do{p=rnd(1,4);qq=nz(-6,6);r=rnd(1,4);s=nz(-6,6)}while(p*s===qq*r);
    q=fracH(p+(qq<0?" "+M+" ":" + ")+fracH(Math.abs(qq),x),r+(s<0?" "+M+" ":" + ")+fracH(Math.abs(s),x));target=e=>(p+qq/e[x])/(r+s/e[x]);
    const N=joinTerms([[p,x],[qq,""]]),D=joinTerms([[r,x],[s,""]]);sol=fracH(N,D);A=[p+"*x+("+qq+")",r+"*x+("+s+")"];
    steps=["Oben und unten mit "+x+" erweitern, das ist der Hauptnenner der kleinen Brüche.","Oben: ("+p+(qq<0?" "+M+" ":" + ")+fracH(Math.abs(qq),x)+")"+DOT+x+" = "+N,"Unten: ("+r+(s<0?" "+M+" ":" + ")+fracH(Math.abs(s),x)+")"+DOT+x+" = "+D,"Ergebnis: <b>"+sol+"</b>"]}
  else if(t===3){const a=rnd(1,9),b=rnd(2,9),g=gcd(a,b);
    q=fracH(fracH(a,x),fracH(b,sup(x,2)));target=e=>(a/e[x])/(b/(e[x]*e[x]));sol=b/g===1?(a/g===1?"":a/g)+x:fracH((a/g===1?"":a/g)+x,b/g);A=[(a/g)+"*x",String(b/g)];
    steps=["Mal den Kehrwert: "+fracH(a,x)+DOT+fracH(sup(x,2),b)+" = "+fracH(a+sup(x,2),b+x),"Ein x kürzt sich weg"+(g>1?", die Zahlen durch "+g:"")+".","Ergebnis: <b>"+sol+"</b>"]}
  else{const y="y",a=rnd(1,5),s=pick([1,-1]);vars=[x,y];
    q=fracH(a,fracH(1,x)+(s>0?" + ":" "+M+" ")+fracH(1,y));target=e=>a/(1/e[x]+s/e[y]);
    const dn=s>0?"y + x":"y "+M+" x";sol=fracH((a===1?"":a)+"xy",dn);A=[a+"*x*y",s>0?"y+x":"y-x"];
    steps=["Unten auf einen Bruchstrich: "+fracH(1,x)+(s>0?" + ":" "+M+" ")+fracH(1,y)+" = "+fracH(dn,"xy"),"Mal den Kehrwert: "+a+DOT+fracH("xy",dn),"Ergebnis: <b>"+sol+"</b>"]}
  return{instr:"Löse den Doppelbruch auf und vereinfache.",q,form:exprFracFields(),keys:vars.length>0,note:vars.length?NOTE_EXPR:"Nur Zahlen eintragen, gekürzt.",ans:A,
    check:i=>checkFrac(i[0],i[1],target,vars),solution:sol,steps,rule:R.dbl};
}

/* ---------- 9 Gleichungen, jeder Schritt mit Umformung ---------- */
const opX=(c,x)=>(c>0?"+ ":M+" ")+(Math.abs(c)===1?"":Math.abs(c))+x;
const opN=n=>(n>0?"+ ":M+" ")+Math.abs(n);
const row=(eq,op)=>eq+(op?'<span class="op">| '+op+'</span>':"");
const rowT=(eq,txt)=>eq+'<span class="op" style="font-family:var(--f-body)">'+txt+'</span>';
function genEq(){
  const t=rnd(1,5),x=pick(["x","x","x","w"]);let x0=nz(-9,9),q,steps,rule=R.eq;
  const div=(k,eq)=>k===1?null:": "+np(k);
  if(t===1){let a,c;do{a=nz(-9,9);c=nz(-9,9)}while(a===c);const b=rnd(-20,20),d=a*x0+b-c*x0,k=a-c;
    q=joinTerms([[a,x],[b,""]])+" = "+joinTerms([[c,x],[d,""]]);steps=[row(q,opX(-c,x))];
    const l2=joinTerms([[k,x],[b,""]])+" = "+cs(d);if(b){steps.push(row(l2,opN(-b)))}
    steps.push(row(joinTerms([[k,x]])+" = "+cs(d-b),div(k)));}
  else if(t===2){const a=rnd(2,6),b=rnd(1,9),d=rnd(1,9),c=(a+1)*x0-d-a*b;
    q=a+"("+x+" "+M+" "+b+") = "+cs(c)+" "+M+" ("+x+" "+M+" "+d+")";
    steps=[rowT(q,"Klammern auflösen"),rowT(a+x+" "+M+" "+a*b+" = "+cs(c)+" "+M+" "+x+" + "+d,"rechts zusammenfassen"),
      row(a+x+" "+M+" "+a*b+" = "+joinTerms([[c+d,""],[-1,x]]),opX(1,x)),row((a+1)+x+" "+M+" "+a*b+" = "+cs(c+d),opN(a*b)),row((a+1)+x+" = "+cs(c+d+a*b),div(a+1))]}
  else if(t===3){const a=rnd(1,9),b=nz(-7,7),k=2*b*x0-a*a-b*b;
    q="("+x+" "+M+" "+a+")("+x+" + "+a+") = ("+x+signed(-b)+")<sup>2</sup>"+(k?signed(k):"");
    const rhs=joinTerms([[1,sup(x,2)],[-2*b,x],[b*b+k,""]]);
    steps=[rowT(q,"Klammern auflösen (binomische Formeln)"),row(sup(x,2)+" "+M+" "+a*a+" = "+rhs,M+" "+sup(x,2)),row(M+a*a+" = "+joinTerms([[-2*b,x],[b*b+k,""]]),opX(2*b,x)),
      row(joinTerms([[2*b,x],[-a*a,""]])+" = "+cs(b*b+k),opN(a*a)),row(joinTerms([[2*b,x]])+" = "+cs(b*b+k+a*a),div(2*b))]}
  else if(t===4){let b,d;do{b=nz(-6,6);d=nz(-6,6)}while(b===d||x0+b===0||x0+d===0);let A=x0+b,C=x0+d;const g=gcd(A,C);A/=g;C/=g;if(A<0&&C<0){A=-A;C=-C}
    q=fracH(cs(A),x+signed(b))+" = "+fracH(cs(C),x+signed(d));rule=R.eqFrac;
    steps=[row(q,"· "+lin(x,b)+lin(x,d)),rowT(cs(A)+lin(x,d)+" = "+cs(C)+lin(x,b),"Klammern auflösen"),row(joinTerms([[A,x],[A*d,""]])+" = "+joinTerms([[C,x],[C*b,""]]),opX(-C,x)),
      row(joinTerms([[A-C,x],[A*d,""]])+" = "+cs(C*b),A*d?opN(-A*d):null)];if(A*d)steps.push(row(joinTerms([[A-C,x]])+" = "+cs(C*b-A*d),div(A-C)));else steps[steps.length-1]=row(joinTerms([[A-C,x]])+" = "+cs(C*b),div(A-C))}
  else{let a,b;do{a=rnd(2,6);b=rnd(2,6)}while(a===b);const Lc=lcm(a,b),m=nz(-3,3);x0=Lc*m;const c=x0/a+x0/b;
    q=fracH(x,a)+" + "+fracH(x,b)+" = "+cs(c);rule=R.eqFrac;
    steps=[row(q,"· "+Lc+" (Hauptnenner)"),rowT((Lc/a===1?"":Lc/a)+x+" + "+(Lc/b===1?"":Lc/b)+x+" = "+cs(c*Lc),"zusammenfassen"),row((Lc/a+Lc/b)+x+" = "+cs(c*Lc),div(Lc/a+Lc/b))]}
  steps.push("<b>"+x+" = "+cs(x0)+"</b>");
  return{instr:"Bestimme die Lösung.",q,form:"<span>"+x+" =</span>"+inp("wide","Lösung","Lösung"),note:"Bruch als 3/4 eintragen.",
    ans:[String(x0)],check:i=>{const u=parseNum(i[0]);return isFinite(u)&&close(u,x0)},solution:x+" = "+cs(x0),steps,rule};
}

/* ---------- 10 sin, cos, tan ---------- */
function triSvg(lab){const T=(x,y,s,anc)=>'<text x="'+x+'" y="'+y+'"'+(anc?' text-anchor="'+anc+'"':"")+' class="'+(lab[s]==="?"?"q-mark":"")+'">'+s+(lab[s]?" = "+lab[s]:"")+"</text>";
  return '<svg class="tri" viewBox="0 0 280 180" role="img" aria-label="Rechtwinkliges Dreieck"><polygon points="30,150 240,150 240,30" fill="none" stroke="currentColor" stroke-width="2"/>'+
  '<polyline points="226,150 226,136 240,136" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M70,150 A40,40 0 0 0 64.7,130.7" fill="none" stroke="currentColor" stroke-width="1.5"/>'+
  '<text x="76" y="142">'+lab.al+'</text>'+T(135,172,"b","middle")+T(248,95,"a")+T(120,78,"c","end")+
  '<text x="16" y="156">A</text><text x="246" y="166">C</text><text x="246" y="26">B</text></svg>'}
function genTrig(){
  const r2=v=>Math.round(v*100)/100,deg=Math.PI/180,t=rnd(1,6),al=rnd(15,75);let lab,ans,unit="cm",steps,find;const c=rnd(4,20),b=rnd(3,15),a=rnd(3,15);
  if(t===1){ans=c*Math.sin(al*deg);lab={a:"?",b:"",c:c+" cm",al:"α = "+al+"°"};find="a";steps=["a ist die Gegenkathete von α, c die Hypotenuse: sin α = "+fracH("a","c"),"a = c · sin α = "+c+" · sin "+al+"°"]}
  else if(t===2){ans=c*Math.cos(al*deg);lab={a:"",b:"?",c:c+" cm",al:"α = "+al+"°"};find="b";steps=["b ist die Ankathete von α, c die Hypotenuse: cos α = "+fracH("b","c"),"b = c · cos α = "+c+" · cos "+al+"°"]}
  else if(t===3){ans=b*Math.tan(al*deg);lab={a:"?",b:b+" cm",c:"",al:"α = "+al+"°"};find="a";steps=["a ist die Gegenkathete, b die Ankathete: tan α = "+fracH("a","b"),"a = b · tan α = "+b+" · tan "+al+"°"]}
  else if(t===4){ans=b/Math.cos(al*deg);lab={a:"",b:b+" cm",c:"?",al:"α = "+al+"°"};find="c";steps=["b ist die Ankathete, c die Hypotenuse: cos α = "+fracH("b","c"),"Nach c umstellen: c = "+fracH("b","cos α")+" = "+fracH(b,"cos "+al+"°")]}
  else if(t===5){const cc=Math.max(c,a+1);ans=Math.asin(a/cc)/deg;unit="°";lab={a:a+" cm",b:"",c:cc+" cm",al:"α = ?"};find="α";steps=["Gegenkathete a und Hypotenuse c gegeben: sin α = "+fracH(a,cc),"α = sin⁻¹("+fracH(a,cc)+")"]}
  else{ans=Math.atan(a/b)/deg;unit="°";lab={a:a+" cm",b:b+" cm",c:"",al:"α = ?"};find="α";steps=["Gegenkathete a und Ankathete b gegeben: tan α = "+fracH(a,b),"α = tan⁻¹("+fracH(a,b)+")"]}
  const sol=find+" = "+r2(ans)+(unit==="°"?"°":" cm");steps.push("<b>"+sol+"</b> (gerundet)");
  return{instr:"Rechtwinkliges Dreieck mit dem rechten Winkel bei C. Berechne "+find+".",q:triSvg(lab),
    form:"<span>"+find+" =</span>"+inp("wide","Ergebnis","Ergebnis","decimal")+"<span>"+(unit==="°"?"°":"cm")+"</span>",note:"Auf 2 Stellen nach dem Komma runden. Der Rechner rechnet in Grad.",
    ans:[String(r2(ans))],check:i=>{const u=parseNum(i[0]);return isFinite(u)&&Math.abs(u-ans)<=Math.max(0.02,0.005*ans)},solution:sol,steps,rule:R.trig};
}

/* ---------- 11 Brüche mit Faktorisieren ---------- */
function genFracFact(){
  const t=rnd(1,3),x="x",vars=[x];let q,target,sol,steps,A;
  if(t===1){const p=rnd(1,6),a=nz(-9,9),b=rnd(1,6),s=pick([1,-1]);
    q=fracH(cs(a),sup(x,2)+" "+M+" "+p*p)+(s>0?" + ":" "+M+" ")+fracH(b,x+" + "+p);target=e=>a/(e[x]*e[x]-p*p)+s*b/(e[x]+p);
    const D="("+x+" + "+p+")("+x+" "+M+" "+p+")",N=[a-s*b*p,s*b];sol=fracH(polyHtml(N,x),D);A=["("+N[1]+")*x+("+N[0]+")","(x+"+p+")*(x-"+p+")"];
    steps=["Nenner faktorisieren: "+sup(x,2)+" "+M+" "+p*p+" = "+D+" (3. binomische Formel)","Hauptnenner: "+D,"Zweiten Bruch mit ("+x+" "+M+" "+p+") erweitern. Zähler: "+cs(a)+(s>0?" + ":" "+M+" ")+b+"("+x+" "+M+" "+p+") = "+polyHtml(N,x),"Ergebnis: <b>"+sol+"</b>"]}
  else if(t===2){const p=nz(-5,5),a=rnd(1,9),b=rnd(1,6);
    q=fracH(a,joinTerms([[1,sup(x,2)],[2*p,x],[p*p,""]]))+" "+M+" "+fracH(b,x+signed(p));target=e=>a/((e[x]+p)*(e[x]+p))-b/(e[x]+p);
    const D=lin(x,p)+"<sup>2</sup>",N=[a-b*p,-b];sol=fracH(polyHtml(N,x),D);A=["("+N[1]+")*x+("+N[0]+")","(x+("+p+"))^2"];
    steps=["Nenner faktorisieren: "+joinTerms([[1,sup(x,2)],[2*p,x],[p*p,""]])+" = "+D+" (binomische Formel)","Hauptnenner: "+D,"Zweiten Bruch mit "+lin(x,p)+" erweitern. Zähler: "+a+" "+M+" "+b+lin(x,p)+" = "+polyHtml(N,x),"Ergebnis: <b>"+sol+"</b>"]}
  else{let m,k;do{m=rnd(2,5);k=rnd(2,5)}while(m===k);const n=rnd(1,5),a=rnd(1,5),b=rnd(1,5),Lc=lcm(m,k),top=a*Lc/m+b*Lc/k,g=gcd(top,Lc);
    q=fracH(a,m+x+" "+M+" "+m*n)+" + "+fracH(b,k+x+" "+M+" "+k*n);target=e=>a/(m*e[x]-m*n)+b/(k*e[x]-k*n);
    const D=(Lc/g===1?"":Lc/g)+"("+x+" "+M+" "+n+")";sol=fracH(top/g,D);A=[String(top/g),(Lc/g)+"*(x-"+n+")"];
    steps=["Nenner ausklammern: "+m*1+x+" "+M+" "+m*n+" = "+m+"("+x+" "+M+" "+n+") und "+k+x+" "+M+" "+k*n+" = "+k+"("+x+" "+M+" "+n+")","Hauptnenner: kgV("+m+", "+k+") = "+Lc+", also "+Lc+"("+x+" "+M+" "+n+")",
      "Ersten Bruch mit "+Lc/m+" erweitern, zweiten mit "+Lc/k+". Zähler: "+a+DOT+(Lc/m)+" + "+b+DOT+(Lc/k)+" = "+top+(g>1?", gekürzt durch "+g:""),"Ergebnis: <b>"+sol+"</b>"]}
  return{instr:"Faktorisiere die Nenner, bring auf einen Bruchstrich und vereinfache.",q,form:exprFracFields(),keys:true,note:NOTE_EXPR,ans:A,
    check:i=>checkFrac(i[0],i[1],target,vars),solution:sol,steps,rule:R.fracFact};
}

function attempt(vals){
  tries++;let r=task.check(vals);if(typeof r==="boolean")r={ok:r};

  if(r.ok){solved=true;st.total+=tries===1?1:0;st.right++;if(tries===1){st.streak++;if(st.streak>st.best)st.best=st.streak;removePlk()}playSnd("ok");

  for(const s of strokes){ctx.beginPath();s.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));if(s.length===1)ctx.lineTo(s[0][0]+.1,s[0][1]);ctx.stroke()}}

/* ---------- Taschenrechner (Grad) ---------- */
function calcEval(src){
  let s=String(src).replace(/\s+/g,"").replace(/−/g,"-").replace(/[×·]/g,"*").replace(/÷|:/g,"/").replace(/,/g,".")
    .replace(/sin⁻¹|asin/g,"S").replace(/cos⁻¹|acos/g,"C").replace(/tan⁻¹|atan/g,"T").replace(/sin/g,"s").replace(/cos/g,"c").replace(/tan/g,"t")
    .replace(/sqrt|√/g,"r").replace(/pi|π/g,"p").replace(/²/g,"^2").replace(/³/g,"^3");
  let i=0;const D=Math.PI/180;
  const F={s:x=>Math.sin(x*D),c:x=>Math.cos(x*D),t:x=>Math.tan(x*D),S:x=>Math.asin(x)/D,C:x=>Math.acos(x)/D,T:x=>Math.atan(x)/D,r:Math.sqrt};
  const peek=()=>s[i];
  function expr(){let v=term();while(peek()==="+"||peek()==="-"){const o=s[i++],w=term();v=o==="+"?v+w:v-w}return v}
  function term(){let v=unary();for(;;){const c=peek();if(c==="*"||c==="/"){i++;const w=unary();v=c==="*"?v*w:v/w}else if(c&&/[\d.(pscStCTr]/.test(c)){v*=unary()}else break}return v}
  function unary(){if(peek()==="-"){i++;return -unary()}if(peek()==="+"){i++;return unary()}return power()}
  function power(){const b=atom();if(peek()==="^"){i++;return Math.pow(b,unary())}return b}
  function atom(){const c=peek();if(c===undefined)throw 0;
    if(/[\d.]/.test(c)){let j=i;while(j<s.length&&/[\d.]/.test(s[j]))j++;const v=parseFloat(s.slice(i,j));if(isNaN(v))throw 0;i=j;return v}
    if(c==="p"){i++;return Math.PI}
    if(F[c]){i++;return F[c](power())}
    if(c==="("){i++;const v=expr();if(peek()===")")i++;return v}
    throw 0}
  const v=expr();if(i!==s.length)throw 0;return v}
const CK=[["7"],["8"],["9"],["÷"],["√","fn"],["4"],["5"],["6"],["×"],["²","fn"],["1"],["2"],["3"],["−"],["^","fn"],["0"],["."],["("],[")"],["+"],["sin","fn"],["cos","fn"],["tan","fn"],["π","fn"],["⌫"],["sin⁻¹","fn"],["cos⁻¹","fn"],["tan⁻¹","fn"],["C"],["=","eq"]];

let plkN=0;try{const raw=localStorage.getItem("mt-zp1-plk");const a=JSON.parse(raw||"0");plkN=Array.isArray(a)?a.length:(+a||0)}catch(e){}
function savePlk(){try{localStorage.setItem("mt-zp1-plk",String(plkN))}catch(e){}}
function seeded(n){let t=(n*2654435761+97)>>>0;return()=>{t+=0x6D2B79F5;let r=Math.imul(t^t>>>15,1|t);r^=r+Math.imul(r^r>>>7,61|r);return((r^r>>>14)>>>0)/4294967296}}
const PW=86,PH=81,PAD=8;
function layoutPlk(newIdx){
  const L=$("plk"),Z=$("plkZone");L.innerHTML="";Z.innerHTML="";
  $("plkCount").textContent=plkN?plkN+" Plankton"+(plkN===1?"":"s"):"";
  if(!plkN)return;
  const docW=document.documentElement.clientWidth,docH=Math.max(document.documentElement.scrollHeight-Z.offsetHeight,window.innerHeight);
  L.style.height=docH+"px";
  const obs=[...document.querySelectorAll(".top>*, .panel, .finger:not([hidden])")].map(e=>{const r=e.getBoundingClientRect();return{x:r.left+scrollX-PAD,y:r.top+scrollY-PAD,w:r.width+2*PAD,h:r.height+2*PAD}}).filter(r=>r.w>2*PAD&&r.h>2*PAD);
  const hit=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
  const placed=[];
  for(let k=0;k<plkN;k++){const R=seeded(k+1);let spot=null;
    for(let t=0;t<120&&!spot;t++){const c={x:R()*(docW-PW),y:R()*(docH-PH),w:PW,h:PH};if(c.x<0||c.y<0)continue;
      if(obs.some(o=>hit(c,o)))continue;if(t<80&&placed.some(o=>hit(c,o)))continue;spot=c}
    const im=document.createElement("img");im.src=PLK_IMG;im.alt="";const rot=Math.round(R()*50-25);im.style.setProperty("--rot",rot+"deg");
    if(k===newIdx)im.className="new";
    if(spot){placed.push(spot);im.style.left=spot.x+"px";im.style.top=spot.y+"px";im.style.transform="rotate("+rot+"deg)";L.appendChild(im)}else Z.appendChild(im)}
}
let pendNew=-1;function addPlk(){plkN++;savePlk();pendNew=plkN-1;relayout()}
function removePlk(){if(!plkN)return;plkN--;savePlk();relayout()}
let plkT;const relayout=()=>{clearTimeout(plkT);plkT=setTimeout(()=>{const n=pendNew;pendNew=-1;layoutPlk(n)},120)};
window.addEventListener("resize",relayout);
try{new ResizeObserver(relayout).observe(document.querySelector(".app"))}catch(e){}

function playSnd(kind){if(vol<=0)return;try{const a=new Audio(pick(SND[kind]));a.volume=Math.min(1,vol/100);const pr=a.play();if(pr&&pr.catch)pr.catch(()=>{})}catch(e){}}
$("resetBtn").addEventListener("click",function(){const b=this;
  if(!b._armed){b._armed=true;b.textContent="Wirklich? Nochmal tippen";clearTimeout(b._t);b._t=setTimeout(()=>{b._armed=false;b.textContent="Zurücksetzen"},3000);return}
  b._armed=false;clearTimeout(b._t);b.textContent="Zurückgesetzt";setTimeout(()=>{b.textContent="Zurücksetzen"},1500);
  plkN=0;savePlk();layoutPlk(-1);st.streak=0;st.best=0;st.right=0;st.total=0;save();renderStats()});

let padH=280,extraW=0;try{const h=+localStorage.getItem("mt-zp1-padh");if(h>=160&&h<=2000)padH=h;const w=+localStorage.getItem("mt-zp1-extraw");if(w>=0&&w<=2000)extraW=w}catch(e){}
const notesP=document.querySelector(".panel.notes");
function maxExtra(){const col=notesP.parentElement.getBoundingClientRect();return Math.max(0,Math.floor(document.documentElement.clientWidth-col.right-24))}
function savePad(){try{localStorage.setItem("mt-zp1-padh",String(padH));localStorage.setItem("mt-zp1-extraw",String(extraW))}catch(e){}}
function setPadH(h){padH=Math.max(160,Math.min(2000,Math.round(h)));pad.style.height=padH+"px";$("noteText").style.height=padH+"px";if(mode==="draw")sizePad();savePad()}
function setExtra(w){extraW=Math.max(0,Math.min(maxExtra(),Math.round(w)));notesP.style.setProperty("--extraW",extraW+"px");if(mode==="draw")sizePad();savePad()}
function dragger(el,onMove){let x0=0,y0=0,act=false,st0=null;
  el.addEventListener("pointerdown",e=>{e.preventDefault();act=true;x0=e.clientX;y0=e.clientY;st0={h:padH,w:extraW};el.setPointerCapture(e.pointerId);el.classList.add("drag")});
  el.addEventListener("pointermove",e=>{if(act)onMove(e.clientX-x0,e.clientY-y0,st0)});
  const stop=()=>{if(!act)return;act=false;el.classList.remove("drag");if(typeof relayout==="function")relayout()};
  el.addEventListener("pointerup",stop);el.addEventListener("pointercancel",stop)}
dragger($("grip"),(dx,dy,s0)=>setPadH(s0.h+dy));
dragger($("wgrip"),(dx,dy,s0)=>setExtra(s0.w+dx));
$("grip").addEventListener("keydown",e=>{if(e.key==="ArrowDown"){e.preventDefault();setPadH(padH+40)}else if(e.key==="ArrowUp"){e.preventDefault();setPadH(padH-40)}});
$("wgrip").addEventListener("keydown",e=>{if(e.key==="ArrowRight"){e.preventDefault();setExtra(extraW+40)}else if(e.key==="ArrowLeft"){e.preventDefault();setExtra(extraW-40)}});
window.addEventListener("resize",()=>setExtra(extraW));
setPadH(padH);setExtra(extraW);
